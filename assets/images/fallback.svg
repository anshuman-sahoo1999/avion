<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="#111111">
  <rect width="1200" height="800" fill="#161616"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#252525" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <!-- Architectural geometric lines -->
  <line x1="100" y1="700" x2="1100" y2="100" stroke="#333333" stroke-width="1.5"/>
  <line x1="200" y1="700" x2="1000" y2="100" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="600" cy="400" r="180" stroke="#333333" stroke-width="1" fill="none"/>
  <circle cx="600" cy="400" r="4" fill="#ffffff"/>
  <line x1="580" y1="400" x2="620" y2="400" stroke="#777777" stroke-width="1"/>
  <line x1="600" y1="380" x2="600" y2="420" stroke="#777777" stroke-width="1"/>
  <text x="600" y="440" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" fill="#777777" text-anchor="middle" letter-spacing="4">AVION VISUAL ARCHIVE</text>
  <text x="600" y="465" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="10" fill="#444444" text-anchor="middle" letter-spacing="2">ARCHITECTURAL &amp; INDUSTRIAL APERTURE</text>
</svg>
